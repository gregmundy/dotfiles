# =============================================================================
# Prefix
# =============================================================================

# Remap prefix from C-b to C-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# =============================================================================
# General
# =============================================================================

# True color support (needed for Neovim, bat, delta, etc.)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Large scrollback buffer
set -g history-limit 50000

# No escape delay (critical for Vim/Neovim)
set -sg escape-time 0

# Enable mouse (scroll, select panes, resize panes)
set -g mouse on

# Start windows and panes at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# =============================================================================
# Key bindings
# =============================================================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -r p previous-window
bind -r n next-window

# =============================================================================
# Copy mode (vi style)
# =============================================================================

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# =============================================================================
# Status bar
# =============================================================================

set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"

# Left: session name
set -g status-left "#[fg=blue,bold] #S "
set -g status-left-length 30

# Right: date and time
set -g status-right "#[fg=white,dim]%a %b %d  %H:%M "
set -g status-right-length 40

# Window tabs
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
